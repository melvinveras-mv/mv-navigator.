<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />

  <style>
    :root { --navy:#0f2747; --blue:#2166f3; --panel:#ffffff; --text:#152033; --danger:#e63946; }
    * { box-sizing:border-box; }
    html,body,#map { height:100%; margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--text); }
    #map { background:#dfe8ee; }
    .top {
      position:absolute; z-index:1000; top:14px; left:12px; right:12px;
      display:flex; gap:8px; max-width:760px; margin:auto;
    }
    .searchbox { flex:1; background:#fff; border-radius:18px; box-shadow:0 8px 30px #0002; display:flex; overflow:hidden; }
    .searchbox input { flex:1; border:0; outline:0; padding:15px 16px; font-size:16px; min-width:0; }
    button { border:0; cursor:pointer; font-weight:700; }
    .searchbox button { width:48px; background:#fff; font-size:20px; }
    #searchBtn { background:#2166f3; color:#fff; }
    #clearSearchBtn { color:#687386; }
    .poibar {
      position:absolute; z-index:1000; top:136px; left:50%; transform:translateX(-50%);
      width:min(760px,calc(100% - 24px)); display:flex; gap:6px; overflow-x:auto; padding:2px;
      scrollbar-width:none;
    }
    .poibar::-webkit-scrollbar { display:none; }
    .poi {
      flex:0 0 auto; background:#fff; border-radius:12px; padding:7px 9px; box-shadow:0 5px 18px #0002;
      font-size:11px; white-space:nowrap;
    }
    .poi span { margin-right:4px; }
    .quickbar {
      position:absolute; z-index:1000; top:78px; left:50%; transform:translateX(-50%);
      width:min(760px,calc(100% - 24px)); display:grid; grid-template-columns:repeat(5,1fr); gap:7px;
    }
    .quick {
      background:#fff; border-radius:13px; padding:8px 5px; box-shadow:0 5px 18px #0002;
      font-size:11px; min-height:54px;
    }
    .quick span { display:block; font-size:20px; margin-bottom:2px; }
    .searchhint { position:absolute; top:58px; left:8px; font-size:11px; color:#fff; background:#0f2747dd; padding:4px 8px; border-radius:8px; box-shadow:0 3px 10px #0002; }
    .brand {
      position:absolute; z-index:1000; top:182px; left:16px;

    .weather {

    .tools {

    .tool {
      background:#fff; border-radius:14px; padding:9px 3px; box-shadow:0 5px 18px #0002;
      font-size:11px; min-height:58px;
    }
    .tool span { display:block; font-size:22px; line-height:24px; margin-bottom:2px; }
    .tool.primary { background:var(--blue); color:#fff; }
    .mv-base {
      width:64px; height:58px; position:relative; filter:drop-shadow(0 3px 3px #0004);

    .mv-base .house { position:absolute; left:8px; top:18px; width:48px; height:34px; background:#173c72; border-radius:6px 6px 10px 10px; }

    .hero {

    .panel {

      background:#fff; border-radius:18px; box-shadow:0 10px 35px #0003; padding:13px; display:none;

    .panel.open { display:block; }
    .report-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .report { background:#f3f5f8; border-radius:12px; padding:10px 4px; }
    .result { padding:10px; border-bottom:1px solid #eee; cursor:pointer; }
    .route {
      position:absolute; z-index:1000; left:12px; bottom:92px; background:#fff; padding:10px 13px; border-radius:14px;

    .tiny { color:#687386; font-size:12px; }

    }

    .poi {
      flex:0 0 auto; background:#fff; border-radius:12px; padding:7px 9px; box-shadow:0 5px 18px #0002;

      .poibar { top:132px; }

    #turnText { font-size:14px; opacity:.92; margin-top:2px; }
    #tripHud { left:14px; right:14px; bottom:18px; margin:auto; max-width:560px; padding:11px 14px; }

    .driveTool span { display:block; font-size:22px; }

    body.driving .top,

    .profileBtn {

    .modebar {
      position:absolute; z-index:1000; left:50%; transform:translateX(-50%);
      bottom:88px; width:min(650px,calc(100% - 24px)); display:flex; gap:6px; overflow-x:auto;

    @media (max-width:600px){

    body.driving .musicMini.show{display:block;}
    .musicRow{display:flex;align-items:center;gap:8px;}
    .musicLogo{font-size:23px;}

    .musicCtl{width:34px;height:34px;border-radius:50%;background:#fff;font-size:15px;}
    .settingRow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
    .settingChip{padding:8px 10px;border-radius:12px;background:#edf3fb;font-size:11px;}

    }

    @media(max-width:600px){

      .giroIntro b{font-size:14px}

    /* ===== Mobile cleanup v10 ===== */
    .startTripBtn{
      width:100%; margin-top:10px; padding:15px 18px; border-radius:16px;

    .routePreviewCard{

/* ===== MV Navigator v11 identity ===== */
:root{--mv-navy:#10263f;--mv-teal:#13a6a6;--mv-coral:#ff6b5f;--mv-cream:#f7f2e8;}
.giroIntro{display:none !important;}
body{background:var(--mv-cream);}
.searchbox{border:2px solid rgba(19,166,166,.28);}
.startTripBtn{background:linear-gradient(135deg,var(--mv-teal),#1677b8) !important;}
body.driving .quickbar,
body.driving .poibar,
body.driving .tools,
body.driving .weather,
body.driving .brand,
body.driving .profileBtn{display:none !important;}
/* MV mascot: blue flying character, cape, antenna, MV chest badge */
.mvMascot{
  width:48px;height:48px;position:relative;transform-origin:50% 65%;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.28));
}
.mvMascot .head{position:absolute;left:13px;top:3px;width:23px;height:22px;border-radius:50%;background:#1687d8;border:2px solid #0d4d86;}
.mvMascot .antenna{position:absolute;left:23px;top:-5px;width:3px;height:10px;background:#0d4d86;border-radius:3px;}
.mvMascot .antenna:after{content:"";position:absolute;left:-3px;top:-4px;width:8px;height:8px;border-radius:50%;background:#ffcc4d;}
.mvMascot .eye{position:absolute;top:9px;width:4px;height:5px;border-radius:50%;background:white;}
.mvMascot .eye.e1{left:6px}.mvMascot .eye.e2{right:6px}
.mvMascot .body{position:absolute;left:12px;top:23px;width:25px;height:21px;border-radius:9px 9px 12px 12px;background:#1687d8;border:2px solid #0d4d86;color:white;font:bold 11px/18px Arial;text-align:center;}
.mvMascot .cape{position:absolute;left:4px;top:24px;width:17px;height:22px;background:#ff6b5f;clip-path:polygon(100% 0,100% 100%,0 72%);transform:rotate(12deg);z-index:-1;}
.mvMascot .arm{position:absolute;top:27px;width:15px;height:5px;border-radius:5px;background:#1687d8;border:1px solid #0d4d86;}
.mvMascot .arm.a1{left:1px;transform:rotate(-28deg)}.mvMascot .arm.a2{right:0;transform:rotate(25deg)}


/* ===== MV NAVIGATOR v12 FINAL ===== */
:root{
  --mv-navy:#10263f;
  --mv-teal:#12a6a6;
  --mv-coral:#ff6b5f;
  --mv-sand:#f6f1e8;
  --mv-sky:#dff4f1;
}
html,body{background:var(--mv-sand);}
.giroIntro,.connectionBadge{display:none !important;}
#map{background:var(--mv-sky);}

/* Keep start screen lively but clean */
.brand{
  background:linear-gradient(135deg,var(--mv-navy),#174c66) !important;
}
.searchbox{
  border:2px solid rgba(18,166,166,.28);
  box-shadow:0 7px 24px rgba(16,38,63,.15) !important;
}
#searchBtn{background:var(--mv-teal) !important;color:white !important;}
.startTripBtn{
  background:linear-gradient(135deg,var(--mv-teal),#1777b8) !important;
  color:#fff !important;
}

/* Clean driving mode: no clutter */
body.driving .top,
body.driving .quickbar,
body.driving .poibar,
body.driving .brand,
body.driving .weather,
body.driving .tools,
body.driving .profileBtn,
body.driving .modebar,
body.driving .route,
body.driving .routePreviewCard,
body.driving .giroIntro,
body.driving .connectionBadge{
  display:none !important;
}
body.driving #map{
  filter:saturate(1.08) contrast(1.03);
}

/* Flying MV mascot — this is the ONLY position cursor */
.mvMascot{
  width:54px;
  height:58px;
  position:relative;
  transform-origin:50% 66%;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.28));
  animation:mvFloat .8s ease-in-out infinite alternate;
}
@keyframes mvFloat{
  from{translate:0 2px}
  to{translate:0 -4px}
}
.mvMascot .cape{
  position:absolute;
  left:5px;
  top:27px;
  width:20px;
  height:25px;
  background:var(--mv-coral);
  clip-path:polygon(100% 0,100% 100%,0 72%);
  transform:rotate(12deg);
  transform-origin:100% 0;
  z-index:-1;
  animation:mvCape .42s ease-in-out infinite alternate;
}
@keyframes mvCape{
  from{transform:rotate(8deg) skewY(-4deg)}
  to{transform:rotate(18deg) skewY(5deg)}
}
.mvMascot .head{
  position:absolute;
  left:15px;
  top:4px;
  width:24px;
  height:23px;
  border-radius:50%;
  background:#1687d8;
  border:2px solid #0d4d86;
}
.mvMascot .antenna{
  position:absolute;
  left:26px;
  top:-6px;
  width:3px;
  height:12px;
  background:#0d4d86;
  border-radius:3px;
}
.mvMascot .antenna:after{
  content:"";
  position:absolute;
  left:-3px;
  top:-5px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ffd34f;
  border:1px solid #a67600;
}
.mvMascot .eye{
  position:absolute;
  top:9px;
  width:4px;
  height:5px;
  border-radius:50%;
  background:#fff;
}
.mvMascot .eye.e1{left:6px}
.mvMascot .eye.e2{right:6px}
.mvMascot .body{
  position:absolute;
  left:13px;
  top:27px;
  width:29px;
  height:24px;
  border-radius:10px 10px 13px 13px;
  background:#1687d8;
  border:2px solid #0d4d86;
  color:white;
  font:bold 12px/20px Arial,sans-serif;
  text-align:center;
}
.mvMascot .arm{
  position:absolute;
  top:31px;
  width:16px;
  height:5px;
  border-radius:5px;
  background:#1687d8;
  border:1px solid #0d4d86;
}
.mvMascot .arm.a1{left:1px;transform:rotate(-28deg)}
.mvMascot .arm.a2{right:0;transform:rotate(25deg)}

/* Trail left by MV mascot while moving */
.mvTrailGlow{
  stroke:#29d7d0 !important;
  stroke-width:6 !important;
  stroke-linecap:round !important;
  filter:drop-shadow(0 0 4px rgba(41,215,208,.7));
}

<script>
const map = L.map('map', {zoomControl:false}).setView([42.36,-71.06], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'© OpenStreetMap contributors'
}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);

let user = null, heroMarker = null, baseMarker = null, routeLayer = null, heroTrailLayer = null, destination = null;
let reportMarkers = [], parkingMarkers = [];
let navigationStarted = false;
let selectedSearchPlace=null;
let compassMode='heading';
let heroTrailPoints = [];
let selectedMode = 'car';
const panel = document.getElementById('panel');

function baseIcon(){
  return L.divIcon({
    className:'',
    iconSize:[64,58], iconAnchor:[32,44],
    html:`<div class="mv-base">
      <div class="roof"></div><div class="house"></div><div class="door"></div><div class="badge">MV</div>
    </div>`
  });
}

function heroIcon(heading=0) {
  return L.divIcon({
    className:'',
    iconSize:[58,74], iconAnchor:[29,45],
    html:`<div class="hero" style="transform:rotate(${heading||0}deg)">
      <div class="cape"></div><div class="body"></div><div class="head"></div>
      <div class="badge">MV</div><div class="nose"></div></div>`
  });
}
function showMsg(html){ panel.innerHTML=html; panel.classList.add('open'); }
function hidePanel(){ panel.classList.remove('open'); }

function updateHero(pos) {
  user = [pos.coords.latitude, pos.coords.longitude];
  const heading = Number.isFinite(pos.coords.heading) ? pos.coords.heading : 0;

  if(navigationStarted){
    if(baseMarker){ map.removeLayer(baseMarker); baseMarker=null; }
    if (!heroMarker) heroMarker = L.marker(user,{icon:heroIcon(heading),zIndexOffset:1000}).addTo(map);
    else { heroMarker.setLatLng(user); heroMarker.setIcon(heroIcon(heading)); }

    heroTrailPoints.push(user);
    if(heroTrailPoints.length > 120) heroTrailPoints.shift();
    if(heroTrailLayer) map.removeLayer(heroTrailLayer);
    heroTrailLayer = L.polyline(heroTrailPoints,{
      weight:6, opacity:.75, color:'#29d7d0', dashArray:null, lineCap:'round'
    }).addTo(map);

    if(navigationStarted) map.panTo(user,{animate:true,duration:.5});
  } else {
    if(heroMarker){ map.removeLayer(heroMarker); heroMarker=null; }
    if(!baseMarker) baseMarker = L.marker(user,{icon:baseIcon(),zIndexOffset:900}).addTo(map);
    else baseMarker.setLatLng(user);
  }

  if (!map._mvCentered) { map.setView(user,16); map._mvCentered=true; }
}

function startLocation(){
  if(!navigator.geolocation){ showMsg('Este navegador no permite GPS.'); return; }
  navigator.geolocation.watchPosition(updateHero, e=>{
    showMsg('No pudimos activar tu ubicación. Permite el GPS en el navegador.');
  }, {enableHighAccuracy:true, maximumAge:2000, timeout:12000});
}

async function weather(){
  if(!user) return showMsg('Esperando tu ubicación para consultar el clima.');
  const [lat,lon]=user;
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation,rain,snowfall,weather_code,wind_speed_10m&hourly=precipitation_probability,rain,snowfall,temperature_2m&forecast_days=2&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto`;
  try{
    const d=await fetch(u).then(r=>r.json());
    const c=d.current||{};
    const h=d.hourly||{}, now=Date.now();
    let nextRain=null,nextSnow=null,maxProb=0;
    (h.time||[]).forEach((t,i)=>{
      const tm=new Date(t).getTime();
      if(tm>=now && tm<=now+12*3600e3){
        maxProb=Math.max(maxProb, h.precipitation_probability?.[i]||0);
        if(nextRain===null && (h.rain?.[i]||0)>0) nextRain=t;
        if(nextSnow===null && (h.snowfall?.[i]||0)>0) nextSnow=t;
      }
    });
    const text=`🌡️ <b>${Math.round(c.temperature_2m ?? 0)}°F</b> · viento ${Math.round(c.wind_speed_10m ?? 0)} mph<br>
      ☔ Prob. precipitación próximas 12 h: <b>${maxProb}%</b><br>
      ${nextSnow ? '❄️ Nieve prevista: '+new Date(nextSnow).toLocaleTimeString([], {hour:'numeric'}) :
        nextRain ? '🌧️ Lluvia prevista: '+new Date(nextRain).toLocaleTimeString([], {hour:'numeric'}) :
        '✅ Sin lluvia/nieve inmediata detectada'}`;
    document.getElementById('weather').innerHTML=text;
    return text;
  }catch(e){ document.getElementById('weather').innerHTML='Clima no disponible'; }
}

const STORAGE_KEY='mvNavigatorSavedPlacesV1';
const RECENTS_KEY='mvNavigatorRecentsV1';
const FAVORITES_KEY='mvNavigatorFavoritesV1';

function loadJSON(key, fallback){
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key,value){ localStorage.setItem(key,JSON.stringify(value)); }

function savedPlaces(){ return loadJSON(STORAGE_KEY,{}); }

function addRecent(place){

async function findNearbyPoi(type){
  if(!user) return showMsg('Esperando tu ubicación GPS.');
  const [lat,lon]=user;

  const mapType = {
    supermarket: ['shop','supermarket'],
    pharmacy: ['amenity','pharmacy'],
    fuel: ['amenity','fuel'],
    hospital: ['amenity','hospital'],
    restaurant: ['amenity','restaurant'],
    parking: ['amenity','parking'],
    toilets: ['amenity','toilets'],
    rest_area: ['highway','rest_area']
  }[type];

  const labels = {
    supermarket:'Tiendas', pharmacy:'Farmacias', fuel:'Gasolineras',
    hospital:'Hospitales', restaurant:'Restaurantes', parking:'Parqueo',
    toilets:'Baños', rest_area:'Áreas de descanso'
  };

  if(!mapType) return;
  showMsg(`Buscando ${labels[type].toLowerCase()} cercanos…`);

  const [k,v]=mapType;
  const query=`[out:json][timeout:20];(
    node["${k}"="${v}"](around:12000,${lat},${lon});
    way["${k}"="${v}"](around:12000,${lat},${lon});
    relation["${k}"="${v}"](around:12000,${lat},${lon});
  );out center tags 30;`;

  try{
    const d=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query}).then(r=>r.json());
    const places=(d.elements||[]).map(e=>{
      const la=e.lat??e.center?.lat, lo=e.lon??e.center?.lon, t=e.tags||{};
      if(la==null||lo==null) return null;
      return {name:t.name||labels[type].slice(0,-1)||'Lugar',lat:+la,lon:+lo};
    }).filter(Boolean);

    if(!places.length) return showMsg(`<b>${labels[type]}</b><br>No encontramos resultados cercanos en los datos disponibles.`);

    showMsg(`<b>${labels[type]}</b>`+
      places.map((p,i)=>`<div class="result poi-result" data-i="${i}">${p.name}<br><span class="tiny">Toca para calcular la ruta</span></div>`).join(''));

    panel.querySelectorAll('.poi-result').forEach(el=>{
      el.onclick=()=>routeTo(places[+el.dataset.i]);
    });
  }catch(e){
    showMsg(`No se pudo consultar ${labels[type].toLowerCase()} en este momento.`);
  }
}

function routeSafetyMessage(route){
  // OSRM public demo data does not reliably expose every STOP sign or road curvature.
  // We give safe generic route-aware alerts only when we can infer a strong maneuver.
  try{
    const steps=route.legs?.[0]?.steps||[];
    for(const s of steps.slice(0,8)){
      const man=s.maneuver||{};
      const modifier=(man.modifier||'').toLowerCase();
      const type=(man.type||'').toLowerCase();
      if(modifier.includes('sharp')){
        return '🌀 Amigo, curva fuerte más adelante. Reduce la velocidad.';
      }
      if(type==='roundabout'){
        return '🔄 Amigo, rotonda más adelante. Mantente atento.';
      }
    }
  }catch(e){}
  return null;
}

function haversineMiles(aLat,aLon,bLat,bLon){
  const R=3958.8, toRad=x=>x*Math.PI/180;
  const dLat=toRad(bLat-aLat), dLon=toRad(bLon-aLon);
  const aa=Math.sin(dLat/2)**2+Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(aa));
}

async function searchPlace(){
  const q=document.getElementById('search').value.trim();
  if(!q) return;
  showMsg('Buscando cerca de ti…');

  const params=new URLSearchParams({
    q, format:'jsonv2', addressdetails:'1', limit:'12'
  });

  if(user){
    const d=0.7;
    params.set('viewbox',`${user[1]-d},${user[0]+d},${user[1]+d},${user[0]-d}`);
    params.set('bounded','0');
  }

  let res=[];
  try{
    res=await fetch(`https://nominatim.openstreetmap.org/search?${params.toString()}`,
      {headers:{'Accept-Language':'es'}}).then(r=>r.json());
  }catch(e){
    return showMsg('No se pudo buscar en este momento.');
  }

  const mapped=res.map(r=>{
    const lat=+r.lat, lon=+r.lon;
    const dist=user?haversineMiles(user[0],user[1],lat,lon):99999;
    const a=r.address||{};
    const region=a.state||a.region||'';
    const city=a.city||a.town||a.village||a.municipality||'';
    return {
      name:r.name||r.display_name.split(',')[0],
      display_name:r.display_name,
      lat,lon,dist,region,city
    };
  });

  mapped.sort((a,b)=>a.dist-b.dist);
  const top=mapped.slice(0,8);
  if(!top.length) return showMsg('No encontré resultados cercanos.');

  showMsg('<b>Resultados cercanos</b>'+top.map((r,i)=>`
    <div class="result">

function enterDrivingMode(route, place){
  navigationStarted=true;
  document.body.classList.add('driving');
  const mi=route.distance/1609.344;
  const mins=Math.max(1,Math.round(route.duration/60));
  const eta=new Date(Date.now()+route.duration*1000);
  document.getElementById('timeHud').textContent=`${mins} min`;
  document.getElementById('distanceHud').textContent=`${mi.toFixed(1)} mi`;
  document.getElementById('etaHud').textContent=eta.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  document.getElementById('turnDistance').textContent='Ruta iniciada';
  document.getElementById('turnText').textContent=place.name || 'MV Giro te guía';
  heroTrailPoints=[];
  if(giroVoiceLevel==='intensive'){
    document.getElementById('turnText').textContent='MV Navigator activo: te avisaré con anticipación de salidas y carriles disponibles.';
  }
  if(heroTrailLayer){map.removeLayer(heroTrailLayer); heroTrailLayer=null;}
}

function endDrivingMode(showHomeMessage=true){
  navigationStarted=false;
  document.body.classList.remove('driving');
  document.getElementById('calibrateHint')?.classList.remove('show');
  heroTrailPoints=[];
  if(heroTrailLayer){map.removeLayer(heroTrailLayer); heroTrailLayer=null;}
  if(heroMarker){map.removeLayer(heroMarker);heroMarker=null;}
  if(user){
    if(baseMarker) map.removeLayer(baseMarker);
    baseMarker=L.marker(user,{icon:baseIcon(),zIndexOffset:900}).addTo(map);
  }
  if(showHomeMessage) setTimeout(()=>showMsg(`<b>MV Navigator</b><br>🏠 Llegamos, amigo. MV Giro vuelve a Base MV.`),120);
}

async function routeTo(r){
  hidePanel();
  document.getElementById('detailsSheet')?.classList.remove('show');
  document.getElementById('routePreviewCard')?.classList.remove('show');
  if(!user) return showMsg('Esperando GPS.');
  const place={name:r.display_name||r.name||'Destino',lat:+r.lat,lon:+r.lon};
  addRecent(place);
  destination=[place.lat,place.lon];
  const url=`https://router.project-osrm.org/route/v1/driving/${user[1]},${user[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson&steps=true`;
  try{
    const d=await fetch(url).then(r=>r.json());
    if(!d.routes?.length) return showMsg('No se encontró ruta.');
    const rt=d.routes[0];
    if(routeLayer) map.removeLayer(routeLayer);
    const coords=rt.geometry.coordinates.map(c=>[c[1],c[0]]);
    routeLayer=L.polyline(coords,{weight:7,opacity:.9}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[45,45]});
    const mi=rt.distance/1609.344, min=Math.round(rt.duration/60);
    document.getElementById('routeTitle').textContent='Ruta preparada';
    document.getElementById('routeInfo').textContent=`${mi.toFixed(1)} mi · ${min} min`;

    pendingRoute = rt;
    pendingPlace = place;

    document.getElementById('routePreviewMeta').textContent = `${mi.toFixed(1)} mi · ${min} min`;
    document.getElementById('routePreviewDest').textContent = place.name || 'Destino';
    document.getElementById('routePreviewCard').classList.add('show');

    hidePanel();

    // Keep map visible and route preview clean until user taps Iniciar viaje.
    if(baseMarker){ map.removeLayer(baseMarker); baseMarker=null; }
    if(user){
      if(!heroMarker) heroMarker=L.marker(user,{icon:heroIcon(0),zIndexOffset:1000}).addTo(map);
    }
  }catch(e){ showMsg('No se pudo calcular la ruta.'); }
}

async function findPoliceStations(){
  if(!user) return showMsg('Esperando tu ubicación GPS.');
  showMsg('Buscando estaciones de policía cercanas…');
  const [lat,lon]=user;
  const query=`[out:json][timeout:20];(node["amenity"="police"](around:20000,${lat},${lon});way["amenity"="police"](around:20000,${lat},${lon});relation["amenity"="police"](around:20000,${lat},${lon}););out center tags 25;`;
  try{
    const d=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query}).then(r=>r.json());
    const places=(d.elements||[]).map(e=>{
      const la=e.lat??e.center?.lat, lo=e.lon??e.center?.lon, t=e.tags||{};
      if(la==null||lo==null) return null;
      return {name:t.name||'Estación de policía',lat:+la,lon:+lo};
    }).filter(Boolean);

    if(!places.length) return showMsg('<b>Policía cercana</b><br>No encontramos estaciones en los datos disponibles de esta zona.');

    showMsg('<b>👮 Estaciones de policía cercanas</b>'+
      places.map((p,i)=>`<div class="result police-result" data-i="${i}">${p.name}<br><span class="tiny">Toca para calcular la ruta</span></div>`).join(''));

    panel.querySelectorAll('.police-result').forEach(el=>{
      el.onclick=()=>routeTo(places[+el.dataset.i]);
    });
  }catch(e){
    showMsg('No se pudo consultar estaciones de policía en este momento.');
  }
}

document.getElementById('parkingBtn').onclick=async()=>{
  if(!user)return showMsg('Esperando GPS.');
  showMsg('Buscando estacionamientos cercanos…');
  const [lat,lon]=user;
  const query=`[out:json][timeout:20];(node["amenity"="parking"](around:5000,${lat},${lon});way["amenity"="parking"](around:5000,${lat},${lon});relation["amenity"="parking"](around:5000,${lat},${lon}););out center tags 40;`;
  try{
    const d=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query}).then(r=>r.json());
    parkingMarkers.forEach(m=>map.removeLayer(m)); parkingMarkers=[];
    let paid=0, total=0;
    for(const e of d.elements||[]){
      const p=e.tags||{}, la=e.lat??e.center?.lat, lo=e.lon??e.center?.lon;
      if(la==null||lo==null) continue;
      total++;
      const fee=(p.fee||'').toLowerCase();
      const isPaid=fee==='yes'||fee==='interval'||p['payment:cash']==='yes'||p['payment:credit_cards']==='yes';
      if(isPaid)paid++;
      const m=L.marker([la,lo]).addTo(map).bindPopup(
        `<b>🅿️ ${p.name||'Estacionamiento'}</b><br>${isPaid?'💵 Indicado como de pago':'Precio no confirmado'}${p.capacity?'<br>Capacidad: '+p.capacity:''}`
      );
      parkingMarkers.push(m);
    }
    hidePanel();
    showMsg(`<b>Parqueo cercano</b><br>${total} lugares encontrados; ${paid} aparecen etiquetados como de pago.<br><span class="tiny">La ocupación y el precio exactos en tiempo real requieren datos del operador del estacionamiento.</span>`);
  }catch(e){ showMsg('No se pudo consultar parqueo en este momento.'); }
};
